<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:" />
  <title>FlyPet</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden; user-select: none;
      -webkit-app-region: no-drag;
    }
    #pet {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      height: 96vh; image-rendering: auto;
    }
    #live2d-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #drag-strip {
      position: absolute; left: 25%; top: 0; width: 50%; height: 12%;
      -webkit-app-region: drag;
    }
    #hud {
      position: absolute; left: 4px; top: 2px;
      font: 10px/1.35 -apple-system, "PingFang SC", sans-serif;
      color: rgba(255,255,255,0.85); background: rgba(20,20,25,0.55);
      border-radius: 6px; padding: 3px 7px; pointer-events: none;
      white-space: pre; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <img id="pet" alt="pet" draggable="false" />
  <canvas id="live2d-canvas"></canvas>
  <div id="drag-strip"></div>
  <div id="hud">connecting…</div>
  <!-- Live2D pipeline stack: pixi + Cubism runtime + pixi-live2d-display (NyaDeskPet) -->
  <script src="lib/pixi.min.js"></script>
  <script src="lib/live2dcubismcore.min.js"></script>
  <script src="lib/pixi-live2d-cubism4.min.js"></script>
  <script type="module" src="js/flypet/flypet.js"></script>
</body>
</html>
